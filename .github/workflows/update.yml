name: Update Vedic Calendar

on:
  schedule:
    - cron: '0 0 1,15 * *'  # Runs automatically twice a month
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install icalendar
      - run: python generate_ics.py
      - name: Commit and push feed.ics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.ics
          git commit -m "Auto-update calendar feed" || exit 0
          git push
